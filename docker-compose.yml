name: northstar

# Full federated commerce infrastructure.
# Replaces the legacy single-instance compose and the spike compose.
# Brings up the 8 subsystems referenced by ADRs 001-005 in one `docker compose up`.

services:

  # ── Keycloak (group IdP, realm auto-imported) ─────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: keycloak.localtest.me
      KC_HOSTNAME_PORT: "8080"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/spike/keycloak/realm-northstar.json:/opt/keycloak/data/import/realm-northstar.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ── PostgreSQL for BU1 ────────────────────────────────────────────────────
  db_bu1:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nop_bu1
      POSTGRES_USER: nop
      POSTGRES_PASSWORD: noppassword
    volumes:
      - db_bu1_data:/var/lib/postgresql/data
      - ./infra/spike/pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nop -d nop_bu1"]
      interval: 5s
      retries: 10

  # ── PostgreSQL for BU2 ────────────────────────────────────────────────────
  db_bu2:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nop_bu2
      POSTGRES_USER: nop
      POSTGRES_PASSWORD: noppassword
    volumes:
      - db_bu2_data:/var/lib/postgresql/data
      - ./infra/spike/pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nop -d nop_bu2"]
      interval: 5s
      retries: 10

  # ── RabbitMQ (transactional outbox broker, ADR-003) ───────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    # Enable the bundled rabbitmq_prometheus plugin so infra/observability/prometheus/prometheus.yml
    # can scrape rabbitmq:15692 with zero application code changes.
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus
      && rabbitmq-server"
    environment:
      RABBITMQ_DEFAULT_USER: northstar
      RABBITMQ_DEFAULT_PASS: northstar
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Meilisearch (federated search engine, ADR-005) ────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.7
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: northstar-meili-master-key
      # Native Prometheus exporter on /metrics. Picked up by infra/observability/prometheus/prometheus.yml.
      MEILI_EXPERIMENTAL_ENABLE_METRICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── EspoCRM database (MariaDB) ────────────────────────────────────────────
  espocrm_db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: espocrm_root
      MARIADB_DATABASE: espocrm
      MARIADB_USER: espocrm
      MARIADB_PASSWORD: espocrm
    volumes:
      - espocrm_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── EspoCRM (single source of customer truth, ADR-003 consumer) ───────────
  espocrm:
    image: espocrm/espocrm:latest
    depends_on:
      espocrm_db:
        condition: service_healthy
    environment:
      ESPOCRM_DATABASE_HOST: espocrm_db
      ESPOCRM_DATABASE_NAME: espocrm
      ESPOCRM_DATABASE_USER: espocrm
      ESPOCRM_DATABASE_PASSWORD: espocrm
      ESPOCRM_ADMIN_USERNAME: admin
      ESPOCRM_ADMIN_PASSWORD: admin
      ESPOCRM_SITE_URL: http://localhost:8083
    ports:
      - "8083:80"
    volumes:
      - espocrm_data:/var/www/html
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── EspoCRM consumer (ADR-003: relay → CRM) ──────────────────────────────
  espocrm_consumer:
    build:
      context: ./src/Workers/EspoCrmConsumer
      dockerfile: Dockerfile
    environment:
      RABBITMQ_URI: amqp://northstar:northstar@rabbitmq:5672/
      ESPOCRM_URL: http://espocrm:80/
      ESPOCRM_USER: admin
      ESPOCRM_PASS: admin
      # Prometheus metrics endpoint — scraped by infra/observability/prometheus/prometheus.yml
      ASPNETCORE_URLS: http://+:9003
    ports:
      - "9003:9003"
    depends_on:
      rabbitmq:
        condition: service_healthy
      espocrm:
        condition: service_started
    restart: on-failure

  # ── ERP stub for BU1 (ADR-004) ────────────────────────────────────────────
  erp_bu1:
    build:
      context: ./src/Workers/ErpStub
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ERP_BU_ID: bu1
    ports:
      - "9001:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ERP stub for BU2 (ADR-004) ────────────────────────────────────────────
  erp_bu2:
    build:
      context: ./src/Workers/ErpStub
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ERP_BU_ID: bu2
    ports:
      - "9002:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── nopCommerce BU1 (HomeStyle) ───────────────────────────────────────────
  nop_bu1:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:80"
      - "9101:9101"   # Prometheus /metrics (isolated from the DB-bound pipeline)
    environment:
      # Connection string is intentionally absent here so that IsDatabaseInstalled()
      # returns false on a fresh volume, allowing the web installer to run and seed
      # the DB. After the installer completes it writes App_Data/appsettings.json
      # which is persisted via the volume and picked up on every subsequent restart.
      # ADR-001: isolated connection — points only to db_bu1, never db_bu2
      RABBITMQ_URI: amqp://northstar:northstar@rabbitmq:5672/
      MEILISEARCH_URI: http://meilisearch:7700
      MEILISEARCH_KEY: northstar-meili-master-key
      ERP_URI: http://erp_bu1:8080
      BU_ID: bu1
      # ADR-002: per-BU OIDC client. Authority uses the host-resolvable name so the
      # browser-side redirect chain stays consistent with the backchannel discovery doc.
      KEYCLOAK_AUTHORITY: http://keycloak.localtest.me:8080/realms/northstar
      KEYCLOAK_CLIENT_ID: bu1-nopcommerce
      KEYCLOAK_CLIENT_SECRET: bu1-secret
    volumes:
      - nop_bu1_app_data:/app/App_Data
      - ./infra/assets/images/bu1:/app/wwwroot/images/uploaded
      - nop_bu1_thumbs:/app/wwwroot/images/thumbs
    depends_on:
      db_bu1:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      erp_bu1:
        condition: service_healthy
    extra_hosts:
      - "keycloak.localtest.me:host-gateway"

  # ── Group Portal (landing page, port 8000) ───────────────────────────────
  portal:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./infra/portal:/usr/share/nginx/html:ro
      - ./infra/portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # ── nopCommerce BU2 (WorkSpace) ───────────────────────────────────────────
  nop_bu2:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:80"
      - "9102:9101"   # Prometheus /metrics (isolated from the DB-bound pipeline)
    environment:
      # See nop_bu1 comment above — same pattern, isolated to db_bu2.
      # ADR-001: isolated connection — points only to db_bu2, never db_bu1
      RABBITMQ_URI: amqp://northstar:northstar@rabbitmq:5672/
      MEILISEARCH_URI: http://meilisearch:7700
      MEILISEARCH_KEY: northstar-meili-master-key
      ERP_URI: http://erp_bu2:8080
      BU_ID: bu2
      # ADR-002: per-BU OIDC client. See nop_bu1 for rationale on the authority hostname.
      KEYCLOAK_AUTHORITY: http://keycloak.localtest.me:8080/realms/northstar
      KEYCLOAK_CLIENT_ID: bu2-nopcommerce
      KEYCLOAK_CLIENT_SECRET: bu2-secret
    volumes:
      - nop_bu2_app_data:/app/App_Data
      - ./infra/assets/images/bu2:/app/wwwroot/images/uploaded
      - nop_bu2_thumbs:/app/wwwroot/images/thumbs
    depends_on:
      db_bu2:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      erp_bu2:
        condition: service_healthy
    extra_hosts:
      - "keycloak.localtest.me:host-gateway"

volumes:
  db_bu1_data:
  db_bu2_data:
  nop_bu1_app_data:
  nop_bu2_app_data:
  nop_bu1_thumbs:
  nop_bu2_thumbs:
  rabbitmq_data:
  meilisearch_data:
  espocrm_data:
  espocrm_db_data:
