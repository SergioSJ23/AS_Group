apiVersion: 1

# Per-BU PostgreSQL datasources. Used by the ADR-001 panel to count orders
# directly in each BU database, proving data isolation: when one BU's DB is
# stopped its series goes to "no data" while the other keeps reporting.
datasources:
  - name: BU1 Postgres
    uid: pg_bu1               # stable UID referenced by dashboards/adr-evidence.json
    type: postgres
    access: proxy
    url: db_bu1:5432
    user: nop
    database: nop_bu1
    secureJsonData:
      password: noppassword
    jsonData:
      database: nop_bu1
      sslmode: disable
      postgresVersion: 1600
    editable: false

  - name: BU2 Postgres
    uid: pg_bu2               # stable UID referenced by dashboards/adr-evidence.json
    type: postgres
    access: proxy
    url: db_bu2:5432
    user: nop
    database: nop_bu2
    secureJsonData:
      password: noppassword
    jsonData:
      database: nop_bu2
      sslmode: disable
      postgresVersion: 1600
    editable: false
