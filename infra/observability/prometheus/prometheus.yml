global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    project: northstar

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: rabbitmq_per_queue
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: meilisearch
    metrics_path: /metrics
    # Meilisearch enforces the master key on /metrics when MEILI_MASTER_KEY is set
    # (see docker-compose.yml). Keep this in sync if you rotate the key.
    authorization:
      type: Bearer
      credentials: northstar-meili-master-key
    static_configs:
      - targets: ["meilisearch:7700"]

  # nopCommerce exposes /metrics on a dedicated port (9101), isolated from the
  # DB-bound storefront pipeline so the scrape survives a BU database outage
  # (ADR-001 isolation demo). See Program.cs MetricsPort.
  - job_name: nopcommerce
    metrics_path: /metrics
    static_configs:
      - targets: ["nop_bu1:9101"]
        labels:
          bu: bu1
      - targets: ["nop_bu2:9101"]
        labels:
          bu: bu2

  # ADR-003: CRM consumer async relay — crm_messages_processed/failed/duplicate_total
  - job_name: espocrm_consumer
    metrics_path: /metrics
    static_configs:
      - targets: ["espocrm_consumer:9003"]

  # ADR-002: Keycloak SSO — keycloak_logins_total, keycloak_login_errors_total
  # Requires KC_METRICS_ENABLED=true (set in docker-compose.yml).
  # Management port 9000 is internal to the docker network; not exposed on the host.
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]
